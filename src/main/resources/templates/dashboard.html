<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color:#f5f7fa;">
<div class="container mt-4">

    <!-- Navbar -->
    <ul class="nav nav-pills justify-content-end mb-4">
        <li class="nav-item">
            <a class="nav-link active" href="dashboard">Dashboard</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="enquiry">Add Enquiry</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="view-enquiries">View Enquiries</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-danger" href="logout">Logout</a>
        </li>
    </ul>

    <!-- Title -->
    <h3 class="mb-4 text-center">📊 My Leads Dashboard</h3>

    <!-- Cards Row -->
    <div class="row g-4">

        <!-- Total Enquiries -->
        <div class="col-md-3">
            <div class="card shadow-sm border-0 text-center">
                <div class="card-body">
                    <h6 class="text-muted">Total Enquiries</h6>
                    <h2 class="fw-bold text-primary" th:text="${dashboardInfo.totalEnqs}">0</h2>
                </div>
            </div>
        </div>

        <!-- New Enquiries -->
        <div class="col-md-3">
            <div class="card shadow-sm border-0 text-center">
                <div class="card-body">
                    <h6 class="text-muted">New Enquiries</h6>
                    <h2 class="fw-bold text-success" th:text="${dashboardInfo.newEnqs}">0</h2>
                </div>
            </div>
        </div>

        <!-- Enrolled -->
        <div class="col-md-3">
            <div class="card shadow-sm border-0 text-center">
                <div class="card-body">
                    <h6 class="text-muted">Enrolled</h6>
                    <h2 class="fw-bold text-info" th:text="${dashboardInfo.enrolledEnqs}">0</h2>
                </div>
            </div>
        </div>

        <!-- Lost -->
        <div class="col-md-3">
            <div class="card shadow-sm border-0 text-center">
                <div class="card-body">
                    <h6 class="text-muted">Lost Enquiries</h6>
                    <h2 class="fw-bold text-danger" th:text="${dashboardInfo.lostEnqs}">0</h2>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
