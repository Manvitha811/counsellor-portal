<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Enquiry</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2f3, #dfe9f3);
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar-custom {
            background: #fff;
            padding: 12px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: 10px;
        }

        .btn-primary {
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 600;
        }

        .title {
            font-weight: 700;
            color: #333;
        }
    </style>
</head>
<body>
<div class="container mt-4">

    <!-- Navbar -->
    <div class="navbar-custom d-flex justify-content-end mb-4">
        <ul class="nav nav-pills">
            <li class="nav-item">
                <a class="nav-link active" href="dashboard">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="enquiry">Add Enquiry</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="view-enquiries">View Enquiries</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-danger" href="logout">Logout</a>
            </li>
        </ul>
    </div>

    <!-- Form Card -->
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card p-4">

                <h3 class="text-center mb-4 title">Edit Enquiry</h3>

                <!-- Messages -->
                <div class="text-center">
                    <p class="text-success" th:text="${smsg}"></p>
                    <p class="text-danger" th:text="${emsg}"></p>
                </div>

                <form th:action="@{/enquiry}" th:object="${enquiryDto}" method="post">

                    <div class="mb-3">
                        <label class="form-label">Enquiry ID</label>
                        <input type="number" class="form-control" th:field="*{enqId}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Student Name</label>
                        <input type="text" class="form-control" th:field="*{stuName}" placeholder="Enter name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Student Phone</label>
                        <input type="number" class="form-control" th:field="*{stuPhno}" placeholder="Enter phone number" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Training Mode</label>
                        <select class="form-select" th:field="*{classMode}">
                            <option value="">-Select-</option>
                            <option value="Online">Online</option>
                            <option value="Classroom">Classroom</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Select Course</label>
                        <select class="form-select" th:field="*{courseId}">
                            <option value="">-Select-</option>
                            <option th:each="course : ${courses}"
                                    th:value="${course.courseId}"
                                    th:text="${course.courseName}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Enquiry Status</label>
                        <select class="form-select" th:field="*{enqStatus}" required>
                            <option value="">-Select-</option>
                            <option value="NEW">New</option>
                            <option value="ENROLLED">Enrolled</option>
                            <option value="LOST">Lost</option>
                        </select>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Update Enquiry</button>
                    </div>

                </form>

            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
