<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2f3, #dfe9f3);
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .navbar-custom {
            background: white;
            padding: 12px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .table {
            border-radius: 15px;
            overflow: hidden;
        }

        .btn {
            border-radius: 10px;
        }

        .form-select {
            border-radius: 10px;
        }

        .title {
            font-weight: 700;
        }
    </style>
</head>

<body>

<div class="container mt-4">

    <!-- Navbar -->
    <div class="navbar-custom d-flex justify-content-end mb-4">
        <ul class="nav nav-pills">
            <li class="nav-item">
                <a class="nav-link active" href="dashboard">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="enquiry">Add Enquiry</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="view-enquiries">View Enquiries</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-danger" href="logout">Logout</a>
            </li>
        </ul>
    </div>

    <!-- Title -->
    <h3 class="mb-4 text-center title">View My Leads</h3>

    <!-- Filter Card -->
    <div class="card p-4 mb-4">
        <form th:action="@{/filter-enqs}" th:object="${filter}" method="post">
            <div class="row g-3 align-items-end">

                <div class="col-md-3">
                    <label class="form-label">Class Mode</label>
                    <select class="form-select" th:field="*{classMode}">
                        <option value="">-Select-</option>
                        <option value="Online">Online</option>
                        <option value="Classroom">Classroom</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Course</label>
                    <select class="form-select" th:field="*{courseId}">
                        <option value="">-Select-</option>
                        <option th:each="course : ${courses}"
                                th:value="${course.courseId}"
                                th:text="${course.courseName}">
                        </option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Status</label>
                    <select class="form-select" th:field="*{enqStatus}">
                        <option value="">-Select-</option>
                        <option value="NEW">New</option>
                        <option value="ENROLLED">Enrolled</option>
                        <option value="LOST">Lost</option>
                    </select>
                </div>

                <div class="col-md-3 d-grid">
                    <button type="submit" class="btn btn-primary">Filter</button>
                </div>

            </div>
        </form>
    </div>

    <!-- Table Card -->
    <div class="card p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Course</th>
                    <th>Mode</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>

                <tr th:each="enq, loopCounter : ${enqs}">
                    <td th:text="${loopCounter.index+1}"></td>
                    <td th:text="${enq.stuName}"></td>
                    <td th:text="${enq.stuPhno}"></td>
                    <td th:text="${enq.course.courseName}"></td>
                    <td>
                        <span class="badge bg-info text-dark" th:text="${enq.classMode}"></span>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${enq.enqStatus == 'NEW'} ? ' bg-primary' :
                                             (${enq.enqStatus == 'ENROLLED'} ? ' bg-success' : ' bg-danger')"
                              th:text="${enq.enqStatus}">
                        </span>
                    </td>
                    <td>
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{'/edit-enq?enqId='+${enq.enqId}}">Edit</a>
                    </td>
                </tr>

                <tr th:if="${enqs.size() == 0}">
                    <td colspan="7" class="text-center text-muted">No records found</td>
                </tr>

                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
